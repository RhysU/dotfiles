library: /home/rhys/BeetLibrary.db
directory: /home/rhys/BeetLibrary
plugins: bpd chroma duplicates edit fetchart fromfilename inline lastgenre lyrics mbsync play web

art_filename: albumart
chroma:
    auto: yes
import:
    autotag: yes
    copy: yes
    duplicate_action: remove
    languages: en
    log: beetslog.txt
    verbose: no
    write: yes
item_fields:
    multidisc: 1 if disctotal > 1 else 0
lyrics:
    auto: no
play:
    command: sh -c 'echo "mpg123 keys -- s pause  f next  b restart  , . seek  h help  q quit"; exec mpg123 -C "$@"' mpg123
    raw: yes
paths:
    default: $albumartist/$album/%if{$multidisc,$disc-}$track $title
    singleton: Singletons/$artist - $title
    comp: Compilation/$album/%if{$multidisc,$disc-}$track $title
    albumtype:soundtrack: Soundtracks/$album/%if{$multidisc,$disc-}$track $title
threaded: yes
per_disc_numbering: yes
ui:
    color: yes
